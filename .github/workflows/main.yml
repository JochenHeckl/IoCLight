name: Actions

on:
  push:
    branches: [main]
  pull_request:

jobs:
  run_test:
    name: Run Tests

    permissions:
      contents: read
      checks: write

    strategy:
      matrix:
        unityVersion:
          - 6000.6.7f1
          - 6000.0.82f1
          - 2023.2.22f1
        os:
          - ubuntu-latest
          # - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4.4.0
        with:
          lfs: false

      # Test
      - name: run tests
        uses: game-ci/unity-test-runner@v4.4.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          packageMode: true
          cliVersion: v0.1.76
          unityVersion: ${{ matrix.unityVersion }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
